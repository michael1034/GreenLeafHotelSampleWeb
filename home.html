<!DOCTYPE html>
<html lang="en">

<head>
    <title>Green Leaf Hotel</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <nav class="navbar">
        <div class="logo">Green Leaf Hotel</div>
        <ul class="nav-links">
            <li><a href="contacts.html">Contacts</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="accommodations.html">Accommodations</a></li>
            <li><a href="home.html">Home</a></li>
        </ul>
    </nav>
    <div class="hero-text">
        <h1>Welcome to Green Leaf Hotel</h1>
        <p>Experience the ultimate comfort and luxury at Green Leaf Hotel. Our hotel offers a
            wide range of amenities and services to ensure a memorable stay for our guests.</p>
        <form class="booking-card">
            <h2>Reserve Your Room</h2>
            <div class="date-row">
            <label for="checkin">Check In</label>
            <input type="text" id="checkin" placeholder="Check-in Date" required>
            <label for="checkout">Check Out</label>
            <input type="text" id="checkout" placeholder="Check-out Date" required>
    </div>
    <div class="field">
    <label for="guests">Number of Guests</label>
    <input type="number" id="guests" min="1" max="10" required>
    <button type="submit">Check Availability</button>
    </div>
    </form>
    </div>
    <div class="background-image">
        <img src="image/hotel.avif" alt="Hotel Background">
    </div>

</body>

</html>
